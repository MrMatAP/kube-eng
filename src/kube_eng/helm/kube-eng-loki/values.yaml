# Default values for Kube Eng :: Loki

cluster:
  name: cluster

# Renders a ServiceMonitor CR (templates/sm-loki.yaml), which requires the
# monitoring.coreos.com CRDs to already exist -- install fails outright
# otherwise. Off by default so the chart renders standalone without
# assuming they're present; stack_apply.yml switches this on only when
# stack.prometheus.chart_enabled (see docs/adr/0005).
serviceMonitor:
  enabled: false

loki:
  # Distributed (microservices) mode -- the modern equivalent of the old,
  # now-archived standalone loki-distributed chart, folded into this chart
  # as one of its deployment modes. See the "Distributed Mode" replicas
  # below.
  deploymentMode: Distributed
  loki:
    auth_enabled: false
    commonConfig:
      path_prefix: /var/loki
      replication_factor: 1
    storage:
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      type: s3
      s3:
        s3ForcePathStyle: true
        signatureVersion: v4
        # endpoint/accessKeyId/secretAccessKey are injected by stack_apply.yml
        # at deploy time from infra.s3, the same as Mimir's
        # common.storage.s3 -- baking placeholder values in here is
        # pointless, they're always overridden.
        # TODO: Inject the cluster CA (see kube-eng-pki-trust's ca-trust
        # ConfigMap) once the correct field for this Loki version is
        # confirmed, same as Mimir's common.storage.s3.http.insecure_skip_verify.
        http_config:
          insecure_skip_verify: true
    schemaConfig:
      configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
    pattern_ingester:
      enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
    ruler:
      enable_api: true
    minio:
      enabled: false
    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/index
        cache_location: /var/loki/index_cache
        cache_ttl: 24h         # Can be increased for faster performance over longer query periods, uses more disk space
    schema_config:
      configs:
      - from: 2020-07-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  # A synthetic log-generating/verifying DaemonSet -- one pod per node --
  # useful for testing a real deployment, not for a local single-tenant
  # cluster. `test.enabled` must be turned off alongside it: the chart
  # refuses to render at all otherwise (its own helm-test hook requires the
  # canary it exercises).
  lokiCanary:
    enabled: false
    podLabels: {}
  test:
    enabled: false
  memberlist:
    service:
      publishNotReadyAddresses: true
  gateway:
    enabled: false
  enterprise:
    enabled: false
  # Memcached-backed caches: pure performance optimisations, not needed for
  # correctness. Disabled for the smallest footprint, same as Mimir's
  # chunks-cache/index-cache/metadata-cache/results-cache.
  resultsCache:
    enabled: false
  chunksCache:
    enabled: false
  # Simple Scalable Mode -- unused, we run Distributed instead.
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0

  # Distributed Mode: one replica of each core component, the smallest
  # topology that's actually a working distributed deployment.
  ingester:
    replicas: 1
    # Zone-aware replication defaults on and spreads 'replicas' across 3
    # zone StatefulSets -- 3 ingester pods for replicas: 1, not 1. Not
    # useful with a single replica anyway; matches Mimir's ingester.
    zoneAwareReplication:
      enabled: false
  distributor:
    replicas: 1
  querier:
    replicas: 1
  queryFrontend:
    replicas: 1
  queryScheduler:
    replicas: 1
  indexGateway:
    replicas: 1
  compactor:
    replicas: 1
  # Bloom filters accelerate large-scale queries; not needed at this size.
  bloomGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  patternIngester:
    replicas: 0
  ruler:
    enabled: false
  overridesExporter:
    enabled: false
  minio:
    enabled: false
