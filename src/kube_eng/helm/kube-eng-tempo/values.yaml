#
# Default values for Kube Eng :: Tempo

cluster:
  name: cluster
  edge:
    kind: istio-gateway-api
    fqdn: tempo.cluster.k8s
    gateway:
      name: edge
      ns: edge
      section: tempo

tempo:
  extraVolumes:
  - name: truststore
    configMap:
      name: ca-trust
  tempo:
    reportingEnabled: false
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
    extraVolumeMounts:
    - name: truststore
      mountPath: /opt/truststore
      readOnly: true
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo-traces
          # endpoint/access_key/secret_key are injected by stack_apply.yml
          # at deploy time from infra.s3, the same as Mimir's
          # common.storage.s3 -- baking placeholder values in here is
          # pointless, they're always overridden.
          region: us-east-1
          insecure: false
          tls_insecure_skip_verify: false
          tls_ca_path: /opt/truststore/truststore.pem
  # Renders a ServiceMonitor CR, which requires the monitoring.coreos.com
  # CRDs to already exist -- install fails outright otherwise. Off by
  # default so the chart renders standalone without assuming they're
  # present; stack_apply.yml switches this on only when
  # stack.prometheus.chart_enabled (see docs/adr/0005).
  serviceMonitor:
    enabled: false
    additionalLabels:
      app.kubernetes.io/monitored-by: prometheus
  networkPolicy:
    enabled: false
  serviceAccount:
    create: true
    name: sa-tempo
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
