{{- if .Values.metrics.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-metrics
  labels:
    {{ include "common.labels" . | nindent 4 }}
rules:
  # Required by the discovery.kubernetes{role="endpoints"} and role="node"
  # components in templates/cm.yaml. No monitoring.coreos.com permissions --
  # metrics scraping here never reads a ServiceMonitor/PodMonitor CR, only
  # discovers Services/Endpoints/Nodes directly (see docs/adr/0005).
- apiGroups: [""]
  resources: ["endpoints", "nodes", "pods", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-metrics
  labels:
    {{ include "common.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-metrics
subjects:
- kind: ServiceAccount
  name: {{ .Values.alloy.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
