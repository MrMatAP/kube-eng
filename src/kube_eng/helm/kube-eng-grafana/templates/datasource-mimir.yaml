{{- if .Values.integration.mimir.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: datasource-mimir
  labels:
    {{ include "common.labels" . | nindent 4 }}
    app.kubernetes.io/name: datasource-mimir
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: mimir
    type: prometheus
    access: proxy
    url: {{ .Values.integration.mimir.url }}
    isDefault: {{ .Values.integration.mimir.isDefault }}
{{- end }}
