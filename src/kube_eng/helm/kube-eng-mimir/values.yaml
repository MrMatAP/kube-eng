#
# Default values for Kube Eng :: Mimir

cluster:
  name: cluster
  edge:
    kind: istio-gateway-api
    fqdn: mimir.cluster.k8s
    gateway:
      name: edge
      ns: edge
      section: mimir

mimir:
  # Smallest viable footprint for a local cluster: a single, non-zone-aware
  # replica of every component, the bundled MinIO and Kafka subcharts
  # switched off in favour of the shared infra S3/Kafka services, and the
  # optional caching/exporter/HA components disabled. stack_apply.yml injects
  # the real S3 endpoint and credentials, and switches on Kafka-backed ingest
  # storage when infra.kafka is enabled.
  minio:
    enabled: false
  kafka:
    enabled: false
  rollout_operator:
    enabled: false
  overrides_exporter:
    enabled: false
  alertmanager:
    enabled: false
  ruler:
    enabled: false
  ingester:
    replicas: 1
    # Zone-aware replication spreads replicas across 3 zones by default,
    # which only makes sense with multiple replicas.
    zoneAwareReplication:
      enabled: false
  querier:
    replicas: 1
  query_scheduler:
    replicas: 1
  store_gateway:
    replicas: 1
    zoneAwareReplication:
      enabled: false

  # -- The subchart's own application config lives under this nested "mimir"
  # key (a sibling of the component keys above), see mimir-distributed's
  # own values.yaml for reference.
  #
  # Note: an explicit `null` here only takes effect when supplied through
  # -f/--set at install time (as stack_apply.yml does); baked into this
  # chart's own default values it is silently dropped while the subchart
  # dependency values are coalesced. Chart defaults below therefore only use
  # concrete values, never null, to unset something.
  mimir:
    structuredConfig:
      # Mimir defaults to requiring X-Scope-OrgID on every request. Nothing
      # in this stack (Prometheus/Alloy remote-write, Grafana) sends it, so
      # this single-tenant deployment must switch multi-tenancy off, same as
      # Loki's auth_enabled: false.
      multitenancy_enabled: false

      ingester:
        ring:
          # The ring defaults to 3-way replication. With a single ingester
          # replica that leaves writes without a quorum, so this must match
          # the replica count.
          replication_factor: 1
        # Classic, push-based ingestion needs the ingester's gRPC push API.
        # Kafka-backed ingest storage (switched on by stack_apply.yml when
        # infra.kafka is enabled) turns this back off.
        push_grpc_method_enabled: true
      store_gateway:
        sharding_ring:
          replication_factor: 1
          wait_stability_min_duration: 0s

      # Classic, push-based architecture by default so the chart works
      # standalone without a Kafka broker. When infra.kafka is enabled,
      # stack_apply.yml re-enables ingest_storage and points it at the
      # shared Kafka broker instead of the bundled subchart.
      ingest_storage:
        enabled: false

      common:
        storage:
          backend: s3
          s3:
            http:
              # TODO: Inject the cluster CA (see kube-eng-pki-trust's
              # ca-trust ConfigMap) once the correct s3.http CA field is
              # confirmed for this Mimir version, same as Loki's
              # http_config.insecure_skip_verify.
              insecure_skip_verify: true
      blocks_storage:
        s3:
          bucket_name: mimir-blocks
          # Mimir's common-storage inheritance only fills in fields that are
          # entirely absent from a section; since bucket_name is set here,
          # redeclare this too rather than rely on it being inherited from
          # common.storage.s3.http.
          http:
            insecure_skip_verify: true
