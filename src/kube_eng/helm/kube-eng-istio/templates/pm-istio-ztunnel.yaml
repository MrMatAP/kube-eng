{{- if .Values.monitoring.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    {{ include "common.labels" . | nindent 4 }}
    app.kubernetes.io/name: pm-istio-ztunnel
    app.kubernetes.io/monitored-by: prometheus
  name: pm-istio-ztunnel
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ztunnel
      app.kubernetes.io/part-of: istio
  podMetricsEndpoints:
  - honorLabels: false
    interval: 10s
    scheme: http
    port: ztunnel-stats
    path: /metrics
    relabelings:
    - action: replace
      replacement: ${1}
      sourceLabels:
      - __meta_kubernetes_pod_node_name
      targetLabel: node
{{- end }}