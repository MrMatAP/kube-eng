---
- name: Apply the cluster configuration
  hosts: localhost
  tasks:

  - name: Create the cluster
    block:
    - name: Register the cluster in the IdP
      idp_client:
        idp_url: "{{ infra.idp.client_base_url }}"
        idp_admin_user: "{{ infra.idp.admin_user }}"
        idp_admin_password: "{{ infra.idp.admin_password }}"
        idp_realm: "{{ infra.idp.realm }}"
        idp_ca_path: "{{ infra.pki.ca_truststore_path }}"
        client_id: "{{ cluster.client_id }}"
        name: "{{ cluster.client_name }}"
        description: "{{ cluster.client_description }}"
        root_url: "{{ cluster.admin_endpoint }}"
        redirect_uris: "{{ cluster.callback_urls }}"
        public_client: true
        roles: "{{ cluster.client_roles }}"
        state: present
      register: cluster_idp_client
      no_log: true
    - name: Template the cluster configuration
      ansible.builtin.import_role:
        name: kind_configuration
      vars:
        image: "{{ cluster.image }}"
        control_plane_nodes: "{{ cluster.control_plane_nodes | int }}"
        worker_nodes: "{{ cluster.worker_nodes | int }}"
        cluster_name: "{{ cluster.name }}"
        directory: "{{ host.tool.kind.config_path }}"
        truststore_path: "{{ infra.pki.ca_truststore_path }}"
        # cluster_endpoint, not http_endpoint: the nodes share the Docker
        # network with the registry container and reach it on its in-container
        # port, not the host-published one.
        airgap_registry_url: "{{ infra.registry.cluster_endpoint | trim('/') }}"
        # Node pull identity for the mirror. Empty when a remote registry has no
        # kube-eng-managed password (authenticated out of band) -> anonymous.
        airgap_registry_auth: "{{ (infra.registry.admin_username ~ ':' ~ infra.registry.admin_password) | b64encode if infra.registry.admin_password else '' }}"
        pod_subnet_cidr: "{{ cluster.pod_subnet_cidr }}"
        service_subnet_cidr: "{{ cluster.service_subnet_cidr }}"
        cni: "{{ cluster.cni.kind }}"
        oidc_discovery_url: "{{ infra.idp.issuer_url }}/.well-known/openid-configuration"
        oidc_issuer_url: "{{ infra.idp.issuer_url }}"
        oidc_client_id: "{{ cluster.client_id }}"
        oidc_username_claim: "{{ infra.idp.username_claim }}"
        oidc_groups_claim: "{{ infra.idp.groups_claim }}"
    - name: Deploy the cluster
      kind_cluster:
        cluster_name: "{{ cluster.name }}"
        config_file: "{{ host.tool.kind.config_path }}/config.yaml"
        tool_kind: "{{ host.tool.kind.path }}"
        state: present
    - name: Apply the kind-viewer cluster role binding
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: ansible
        wait: true
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: oidc:kind-viewer
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: view
          subjects:
          - apiGroup: rbac.authorization.k8s.io
            kind: Group
            name: oidc:kind-viewer
    - name: Apply the kind-contributor cluster role binding
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: ansible
        wait: true
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: oidc:kind-contributor
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: edit
          subjects:
          - apiGroup: rbac.authorization.k8s.io
            kind: Group
            name: oidc:kind-contributor
    - name: Apply the kind-admin cluster role binding
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: ansible
        wait: true
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: oidc:kind-admin
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-admin
          subjects:
          - apiGroup: rbac.authorization.k8s.io
            kind: Group
            name: oidc:kind-admin
    - name: Set up IdP authentication in kubectl for when a browser is available
      ansible.builtin.command:
        cmd: >
          {{ host.tool.kubectl.path }} config set-credentials kube-eng-{{ cluster.name }}-idp
          --exec-api-version=client.authentication.k8s.io/v1
          --exec-interactive-mode=Never
          --exec-command=kubectl
          --exec-arg=oidc-login
          --exec-arg=get-token
          --exec-arg="--oidc-issuer-url={{ infra.idp.issuer_url }}"
          --exec-arg="--oidc-client-id={{ cluster.client_id }}"
          --exec-arg="--oidc-redirect-url={{ cluster.admin_endpoint[0] }}"
          --exec-arg="--grant-type=authcode"
    - name: Set up IdP authentication in kubectl for when no browser is available
      ansible.builtin.command:
        cmd: >
          {{ host.tool.kubectl.path }} config set-credentials kube-eng-{{ cluster.name }}-console
          --exec-api-version=client.authentication.k8s.io/v1
          --exec-interactive-mode=Never
          --exec-command=kubectl
          --exec-arg=oidc-login
          --exec-arg=get-token
          --exec-arg="--oidc-issuer-url={{ infra.idp.issuer_url }}"
          --exec-arg="--oidc-client-id={{ cluster.client_id }}"
          --exec-arg="--oidc-redirect-url={{ cluster.admin_endpoint[0] }}"
          --exec-arg="--grant-type=authcode-keyboard"
    - name: Declare a kubectl context for the cluster that uses IdP browser-based authentication
      ansible.builtin.command:
        cmd: >
          {{ host.tool.kubectl.path }} config set-context kube-eng-{{ cluster.name }}-idp
          --cluster=kind-{{ cluster.name }}
          --user=kube-eng-{{ cluster.name }}-idp
    - name: Declare a kubectl context for the cluster that uses IdP console-based authentication
      ansible.builtin.command:
        cmd: >
          {{ host.tool.kubectl.path }} config set-context kube-eng-{{ cluster.name }}-console
          --cluster=kind-{{ cluster.name }}
          --user=kube-eng-{{ cluster.name }}-console

  - name: Apply CRDs
    block:
    - name: Apply the Gateway API CRDs
      kubernetes.core.k8s:
        state: present
        apply: true
        src: "{{ preheat_path }}/gateway-api-crds.yaml"
        server_side_apply:
          field_manager: ansible
        wait: true

  - name: Deploy Cilium CNI, if enabled
    when: "cluster.cni.kind == 'cilium'"
    block:
    - name: Deploy Cilium
      kubernetes.core.helm:
        name: cilium-system
        create_namespace: true
        release_namespace: cilium
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-cilium"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          cluster:
            name: "{{ cluster.name }}"
            edge:
              kind: "{{ cluster.edge.kind }}"
              fqdn: "{{ cluster.cni.hostname }}.{{ infra.dns.zone }}"
              gateway:
                name: "{{ cluster.edge.name }}"
                ns: "{{ cluster.edge.ns }}"
          cilium:
            cni:
              exclusive: "{{ cluster.cni.exclusive }}"
            ui:
              enabled: "{{ cluster.cni.ui }}"

  - name: Deploy Istio, if enabled
    when: "cluster.mesh.enabled | bool == true"
    block:
    - name: Deploy Istio
      kubernetes.core.helm:
        name: istio
        create_namespace: true
        release_namespace: "{{ cluster.mesh.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-istio"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          ambient: "{{ cluster.mesh.kind == 'istio-ambient' }}"
          classic_gateway: "{{ cluster.edge.kind == 'istio' }}"
          overrides_istiod:
            defaultRevision: default
            profile: "{{ (cluster.mesh.kind == 'istio-ambient') | ternary('ambient', 'default') }}"
          overrides_cni:
            profile: "{{ (cluster.mesh.kind == 'istio-ambient') | ternary('ambient', 'default') }}"
    - name: Re-direct PG resolution
      block:
      - name: Create a service entry for the PG service
        kubernetes.core.k8s:
          state: present
          definition:
            apiVersion: networking.istio.io/v1
            kind: ServiceEntry
            metadata:
              name: service-pg
              namespace: "{{ cluster.mesh.ns }}"
              labels:
                app.kubernetes.io/name: service-pg
            spec:
              location: MESH_EXTERNAL
              resolution: DNS
              hosts:
              - "{{ infra.pg.client_fqdn }}"
              ports:
              - name: postgres
                number: "{{ infra.pg.port }}"
                protocol: TCP
    - name: Re-direct IDP resolution
      block:
      - name: Create a service entry for the IDP service
        kubernetes.core.k8s:
          state: present
          definition:
            apiVersion: networking.istio.io/v1
            kind: ServiceEntry
            metadata:
              name: service-idp
              namespace: "{{ cluster.mesh.ns }}"
              labels:
                app.kubernetes.io/name: service-idp
            spec:
              location: MESH_EXTERNAL
              resolution: DNS
              hosts:
              - "{{ infra.idp.client_fqdn }}"
              ports:
              - name: idp-https
                number: "{{ infra.idp.port }}"
                protocol: HTTPS
    - name: Re-direct S3 resolution
      block:
      - name: Create a service entry for the S3 service
        kubernetes.core.k8s:
          state: present
          definition:
            apiVersion: networking.istio.io/v1
            kind: ServiceEntry
            metadata:
              name: service-s3
              namespace: "{{ cluster.mesh.ns }}"
              labels:
                app.kubernetes.io/name: service-s3
            spec:
              location: MESH_EXTERNAL
              resolution: DNS
              hosts:
              - "{{ infra.s3.client_fqdn }}"
              ports:
              - name: s3-https
                number: "{{ infra.s3.port }}"
                protocol: HTTPS
    - name: Re-direct Kafka resolution, if enabled
      when: "infra.kafka.enabled | bool == true"
      block:
      - name: Create a service entry for the Kafka service
        kubernetes.core.k8s:
          state: present
          definition:
            apiVersion: networking.istio.io/v1
            kind: ServiceEntry
            metadata:
              name: service-kafka
              namespace: "{{ cluster.mesh.ns }}"
              labels:
                app.kubernetes.io/name: service-kafka
            spec:
              location: MESH_EXTERNAL
              resolution: DNS
              hosts:
              - "{{ infra.kafka.client_fqdn }}"
              ports:
              - name: kafka-https
                number: "{{ infra.kafka.port }}"
                protocol: TCP

  - name: Deploy cluster PKI
    block:
    - name: Create and label the cert-manager namespace
      ansible.builtin.import_role:
        name: create_namespace
      vars:
        ns: "{{ cluster.pki.ns }}"
        mesh: "{{ cluster.mesh.kind }}"
    - name: Deploy the PKI Helm chart
      kubernetes.core.helm:
        name: kube-eng-pki
        create_namespace: false
        release_namespace: "{{ cluster.pki.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-pki"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          cert-manager:
            namespace: "{{ cluster.pki.ns }}"
            prometheus:
              enabled: "{{ stack.prometheus.enabled | bool }}"
    - name: Create a secret from the local CA files
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: cluster-ca
            namespace: "{{ cluster.pki.ns }}"
          data:
            tls.crt: "{{ lookup('ansible.builtin.file', infra.pki.ca_path) | b64encode }}"
            tls.key: "{{ lookup('ansible.builtin.file', infra.pki.ca_key_path) | b64encode }}"
    - name: Declare the local CA as an issuer
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: ca-issuer
            namespace: "{{ cluster.pki.ns }}"
          spec:
            ca:
              secretName: cluster-ca
    - name: Deploy the PKI Trust Helm chart
      kubernetes.core.helm:
        name: kube-eng-pki-trust
        create_namespace: false
        release_namespace: "{{ cluster.pki.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-pki-trust"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          trust-manager:
            app:
              trust:
                namespace: "{{ cluster.pki.ns }}"
    - name: Declare the cluster CA trust bundle
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: trust.cert-manager.io/v1alpha1
          kind: Bundle
          metadata:
            name: ca-trust
            namespace: "{{ cluster.pki.ns }}"
          spec:
            sources:
              - useDefaultCAs: true
              - secret:
                  name: cluster-ca
                  key: tls.crt
            target:
              configMap:
                key: "truststore.pem"
              additionalFormats:
                pkcs12:
                  key: "truststore.pkcs12"

  - name: Deploy Edge
    block:
    - name: Create and label the Edge namespace
      ansible.builtin.import_role:
        name: create_namespace
      vars:
        ns: "{{ cluster.edge.ns }}"
        mesh: "{{ cluster.mesh.kind }}"
    - name: Deploy the Edge Helm chart
      kubernetes.core.helm:
        name: edge
        create_namespace: false
        release_namespace: "{{ cluster.edge.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-edge"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          cluster:
            name: "{{ cluster.name }}"
            edge:
              kind: "{{ cluster.edge.kind }}"
              name: "{{ cluster.edge.name }}"
          gateway:
            classname: "{{ cluster.edge.gateway_class }}"
          traefik:
            enabled: "{{ cluster.edge.kind == 'traefik' }}"
          stack:
            prometheus:
              enabled: "{{ stack.prometheus.enabled }}"
              fqdn: "{{ stack.prometheus.hostname }}.{{ infra.dns.zone }}"
            alloy:
              enabled: "{{ stack.alloy.enabled }}"
              fqdn: "{{ stack.alloy.hostname }}.{{ infra.dns.zone }}"
            tempo:
              enabled: "{{ stack.tempo.enabled }}"
              fqdn: "{{ stack.tempo.hostname }}.{{ infra.dns.zone }}"
            grafana:
              enabled: "{{ stack.grafana.enabled }}"
              fqdn: "{{ stack.grafana.hostname }}.{{ infra.dns.zone }}"
            kiali:
              enabled: "{{ stack.kiali.enabled }}"
              fqdn: "{{ stack.kiali.hostname }}.{{ infra.dns.zone }}"

# You now need to start cloud-provider-kind as root
