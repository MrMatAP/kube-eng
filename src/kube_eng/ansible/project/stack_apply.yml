---
- name: Deploy the stack
  hosts: localhost
  tasks:

  # This will wait indefinitely if cloud-provider-kind is not running

  # Attempt picking up the external IP of the Edge Gateway for 10 times, waiting 5 seconds between attempts
  - name: Collect information about the Edge Gateway
    kubernetes.core.k8s_info:
      api_version: gateway.networking.k8s.io/v1
      kind: Gateway
      name: "{{ cluster.edge.name }}"
      namespace: "{{ cluster.edge.ns }}"
    register: edge_gateway
    until: edge_gateway.resources[0].status.addresses[0].value is defined
    retries: 10
    delay: 5

  - name: Do not continue if we do not have an Edge Gateway IP address at this point
    when: edge_gateway.resources[0].status.addresses[0].value is not defined
    ansible.builtin.fail:
      msg: "Could not determine the external IP address of the Edge Gateway. Have you started cloud-provider-kind?"

  - name: Deploy Prometheus
    when: "stack.prometheus.enabled | bool == true"
    block:
    - name: Create and label the Prometheus namespace
      ansible.builtin.import_role:
        name: create_namespace
      vars:
        ns: "{{ stack.prometheus.ns }}"
        mesh: "{{ cluster.mesh.kind }}"
        waypoint: wp-prometheus
    - name: Deploy the Prometheus Helm Chart
      kubernetes.core.helm:
        name: prometheus
        create_namespace: false
        release_namespace: "{{ stack.prometheus.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-prometheus"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          cluster:
            name: "{{ cluster.name }}"
            edge:
              kind: "{{ cluster.edge.kind }}"
              fqdn: "{{ stack.prometheus.hostname }}.{{ infra.dns.domain }}"
              gateway:
                name: "{{ cluster.edge.name }}"
                ns: "{{ cluster.edge.ns }}"
          prometheus:
            prometheus:
              prometheusSpec:
                externalLabels:
                  origin_prometheus: "{{ cluster.name }}"
                remoteWrite: "{{ [{'url': 'http://mimir-gateway.' ~ stack.mimir.ns ~ '.svc.cluster.local/api/v1/push'}] if stack.mimir.enabled else [] }}"
    - name: Update DNS with a record for Prometheus
      dns_record:
        dns_ip: "{{ infra.dns.ip }}"
        dns_admin_key_name: "{{ infra.dns.admin_key_name }}"
        dns_admin_key_secret: "{{ infra.dns.admin_key_secret }}"
        dns_protocol: "{{ infra.dns.protocol }}"
        dns_zone: "{{ infra.dns.zone }}"
        dns_record: "{{ stack.prometheus.hostname }}.{{ infra.dns.domain }}."
        dns_value: "{{ edge_gateway.resources[0].status.addresses[0].value }}"
        dns_ttl: "{{ infra.dns.ttl | int }}"

  - name: Deploy Mimir
    when: "stack.mimir.enabled | bool == true"
    block:
      - name: Create the Mimir S3 bucket
        s3_bucket:
          s3_endpoint: "{{ infra.s3.api_endpoint }}"
          s3_access_key: "{{ infra.s3.access_key }}"
          s3_secret_key: "{{ infra.s3.secret_key }}"
          s3_region: "{{ infra.s3.region }}"
          s3_ca_path: "{{ infra.pki.ca_truststore_path }}"
          bucket_name: mimir-blocks
          state: present
      - name: Create and label the Mimir namespace
        ansible.builtin.import_role:
          name: create_namespace
        vars:
          ns: "{{ stack.mimir.ns }}"
          mesh: "{{ cluster.mesh.kind }}"
          waypoint: wp-mimir
      - name: Determine Mimir's Kafka-backed ingest storage configuration
        ansible.builtin.set_fact:
          mimir_ingest_storage: "{{ {
            'ingest_storage': {'enabled': true, 'kafka': {
              'address': infra.kafka.client_fqdn ~ ':' ~ (infra.kafka.port | string),
              'topic': 'mimir-ingest',
              'auto_create_topic_default_partitions': 4}},
            'ingester': {'push_grpc_method_enabled': false}
            } if infra.kafka.enabled else {} }}"
      - name: Install Mimir
        kubernetes.core.helm:
          name: mimir
          create_namespace: false
          release_namespace: "{{ stack.mimir.ns }}"
          chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-mimir"
          chart_version: "{{ host.tool.helm.chart_version }}"
          binary_path: "{{ host.tool.helm.path }}"
          wait: true
          values:
            cluster:
              name: "{{ cluster.name }}"
              edge:
                kind: "{{ cluster.edge.kind }}"
                fqdn: "{{ stack.mimir.hostname }}.{{ infra.dns.domain }}"
                gateway:
                  name: "{{ cluster.edge.name }}"
                  ns: "{{ cluster.edge.ns }}"
            mimir:
              mimir:
                structuredConfig: "{{ {
                  'common': {'storage': {'s3': {
                    'endpoint': infra.s3.client_fqdn ~ ':' ~ (infra.s3.port | string),
                    'access_key_id': infra.s3.access_key,
                    'secret_access_key': infra.s3.secret_key
                  }}}
                  } | combine(mimir_ingest_storage, recursive=true) }}"
      - name: Update DNS with a record for Mimir
        dns_record:
          dns_ip: "{{ infra.dns.ip }}"
          dns_admin_key_name: "{{ infra.dns.admin_key_name }}"
          dns_admin_key_secret: "{{ infra.dns.admin_key_secret }}"
          dns_protocol: "{{ infra.dns.protocol }}"
          dns_zone: "{{ infra.dns.zone }}"
          dns_record: "{{ stack.mimir.hostname }}.{{ infra.dns.domain }}."
          dns_value: "{{ edge_gateway.resources[0].status.addresses[0].value }}"
          dns_ttl: "{{ infra.dns.ttl | int }}"

  - name: Deploy Grafana
    when: "stack.grafana.enabled | bool == true"
    block:
    - name: Create and label the Grafana namespace
      ansible.builtin.import_role:
        name: create_namespace
      vars:
        ns: "{{ stack.grafana.ns }}"
        mesh: "{{ cluster.mesh.kind }}"
        waypoint: wp-grafana
    - name: Register Grafana in Keycloak
      idp_client:
        idp_url: "{{ infra.idp.client_base_url }}"
        idp_admin_user: "{{ infra.idp.admin_user }}"
        idp_admin_password: "{{ infra.idp.admin_password }}"
        idp_realm: "{{ infra.idp.realm }}"
        idp_ca_path: "{{ infra.pki.ca_truststore_path }}"
        client_id: "{{ stack.grafana.client_id }}"
        name: "Kube Eng :: Grafana :: {{ cluster.name }}"
        description: "Grafana metrics visualisation for the Kube Eng cluster"
        root_url: "https://{{ stack.grafana.hostname }}.{{ infra.dns.domain }}/"
        redirect_uris:
        - "https://{{ stack.grafana.hostname }}.{{ infra.dns.domain }}/login/generic_oauth"
        public_client: false
        flows:
        - direct_access_grants
        roles: "{{ stack.grafana.client_roles }}"
        state: present
      register: grafana_idp_client
      no_log: true
    - name: Create a database for Grafana in PostgreSQL
      when: stack.grafana.db_kind == "postgres"
      pg_database:
        admin_dsn: "{{ infra.pg.admin_dsn }}"
        db_name: "{{ stack.grafana.db_name }}"
        db_user: "{{ stack.grafana.db_user }}"
        db_password: "{{ stack.grafana.db_password }}"
        state: present
    - name: Install Grafana
      kubernetes.core.helm:
        name: grafana
        create_namespace: false
        release_namespace: "{{ stack.grafana.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-grafana"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          cluster:
            name: "{{ cluster.name }}"
            edge:
              kind: "{{ cluster.edge.kind }}"
              fqdn: "{{ stack.grafana.hostname }}.{{ infra.dns.domain }}"
              gateway:
                name: "{{ cluster.edge.name }}"
                ns: "{{ cluster.edge.ns }}"
          integration:
            adminUser: "{{ stack.grafana.admin_user }}"
            adminPassword: "{{ stack.grafana.admin_password }}"
            rootUrl: "https://{{ stack.grafana.hostname }}.{{ infra.dns.domain }}/"
            oauth:
              clientId: "{{ stack.grafana.client_id }}"
              clientSecret: "{{ grafana_idp_client.client_secret }}"
              authUrl: "{{ infra.idp.issuer_url }}/protocol/openid-connect/auth"
              tokenUrl: "{{ infra.idp.issuer_url }}/protocol/openid-connect/token"
              apiUrl: "{{ infra.idp.issuer_url }}/protocol/openid-connect/userinfo"
            database:
              type: "{{ stack.grafana.db_kind }}"
              host: "{{ stack.grafana.db_host }}:{{ stack.grafana.db_port | int }}"
              name: "{{ stack.grafana.db_name }}"
              user: "{{ stack.grafana.db_user }}"
              password: "{{ stack.grafana.db_password }}"
              ssl_mode: "{{ stack.grafana.db_ssl_mode }}"
            prometheus:
              url: "http://prometheus-operated.{{ stack.prometheus.ns }}.svc.cluster.local:9090/"
    - name: Update DNS with a record for Grafana
      dns_record:
        dns_ip: "{{ infra.dns.ip }}"
        dns_admin_key_name: "{{ infra.dns.admin_key_name }}"
        dns_admin_key_secret: "{{ infra.dns.admin_key_secret }}"
        dns_protocol: "{{ infra.dns.protocol }}"
        dns_zone: "{{ infra.dns.zone }}"
        dns_record: "{{ stack.grafana.hostname }}.{{ infra.dns.domain }}."
        dns_value: "{{ edge_gateway.resources[0].status.addresses[0].value }}"
        dns_ttl: "{{ infra.dns.ttl | int }}"

  - name: Deploy Alloy
    when: "stack.alloy.enabled | bool == true"
    block:
    - name: Create and label the Alloy namespace
      ansible.builtin.import_role:
        name: create_namespace
      vars:
        ns: "{{ stack.alloy.ns }}"
        mesh: "{{ cluster.mesh.kind }}"
        waypoint: wp-alloy
    - name: Look up the current version of the Alloy Helm Chart
      ansible.builtin.command:
        cmd: |
          {{ host.tool.helm.path }} show chart
          --version {{ host.tool.helm.chart_version }}
          "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-alloy"
      register: alloy_chart_info
    - name: Deploy the Alloy Helm Chart
      kubernetes.core.helm:
        name: alloy
        create_namespace: false
        release_namespace: "{{ stack.alloy.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-alloy"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          cluster:
            name: "{{ cluster.name }}"
            edge:
              kind: "{{ cluster.edge.kind }}"
              fqdn: "{{ stack.alloy.hostname }}.{{ infra.dns.domain }}"
              gateway:
                name: "{{ cluster.edge.name }}"
                ns: "{{ cluster.edge.ns }}"
          alloy:
            controller:
              podLabels:
                app: alloy
                version: "{{ (alloy_chart_info.stdout | from_yaml).appVersion }}"
    - name: Update DNS with a record for Alloy
      dns_record:
        dns_ip: "{{ infra.dns.ip }}"
        dns_admin_key_name: "{{ infra.dns.admin_key_name }}"
        dns_admin_key_secret: "{{ infra.dns.admin_key_secret }}"
        dns_protocol: "{{ infra.dns.protocol }}"
        dns_zone: "{{ infra.dns.zone }}"
        dns_record: "{{ stack.alloy.hostname }}.{{ infra.dns.domain }}."
        dns_value: "{{ edge_gateway.resources[0].status.addresses[0].value }}"
        dns_ttl: "{{ infra.dns.ttl | int }}"

  - name: Deploy Loki
    when: "stack.loki.enabled | bool == true"
    block:
    - name: Create the loki S3 buckets
      s3_bucket:
        s3_endpoint: "{{ infra.s3.api_endpoint }}"
        s3_access_key: "{{ infra.s3.access_key }}"
        s3_secret_key: "{{ infra.s3.secret_key }}"
        s3_region: "{{ infra.s3.region }}"
        s3_ca_path: "{{ infra.pki.ca_truststore_path }}"
        bucket_name: "{{ item }}"
        state: present
      loop:
      - loki-admin
      - loki-ruler
      - loki-chunks
    - name: Create and label the Loki namespace
      ansible.builtin.import_role:
        name: create_namespace
      vars:
        ns: "{{ stack.loki.ns }}"
        mesh: "{{ cluster.mesh.kind }}"
        waypoint: wp-loki
    - name: Look up the current version of the Loki Helm Chart
      ansible.builtin.command:
        cmd: |
          {{ host.tool.helm.path }} show chart
          --version {{ host.tool.helm.chart_version }}
          "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-loki"
      register: loki_chart_info
    - name: Deploy the Loki Helm chart
      kubernetes.core.helm:
        name: loki
        create_namespace: false
        release_namespace: "{{ stack.loki.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-loki"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          cluster:
            name: "{{ cluster.name }}"
          loki:
            loki:
              podLabels:
                app: loki
                version: "{{ (loki_chart_info.stdout | from_yaml).appVersion }}"
              storage:
                s3:
                  endpoint: "https://{{ infra.s3.client_fqdn }}:{{ infra.s3.port }}"
                  accessKeyId: "{{ infra.s3.access_key }}"
                  secretAccessKey: "{{ infra.s3.secret_key }}"
          lokiCanary:
            podLabels:
              app: loki
              version: "{{ (loki_chart_info.stdout | from_yaml).appVersion }}"
    - name: Update DNS with a record for Loki
      dns_record:
        dns_ip: "{{ infra.dns.ip }}"
        dns_admin_key_name: "{{ infra.dns.admin_key_name }}"
        dns_admin_key_secret: "{{ infra.dns.admin_key_secret }}"
        dns_protocol: "{{ infra.dns.protocol }}"
        dns_zone: "{{ infra.dns.zone }}"
        dns_record: "{{ stack.loki.hostname }}.{{ infra.dns.domain }}."
        dns_value: "{{ edge_gateway.resources[0].status.addresses[0].value }}"
        dns_ttl: "{{ infra.dns.ttl | int }}"

  - name: Deploy Tempo
    when: "stack.tempo.enabled | bool == true"
    block:
    - name: Create the Tempo S3 buckets
      s3_bucket:
        s3_endpoint: "{{ infra.s3.api_endpoint }}"
        s3_access_key: "{{ infra.s3.access_key }}"
        s3_secret_key: "{{ infra.s3.secret_key }}"
        s3_region: "{{ infra.s3.region }}"
        s3_ca_path: "{{ infra.pki.ca_truststore_path }}"
        bucket_name: tempo-traces
        state: present
    - name: Create and label the Tempo namespace
      ansible.builtin.import_role:
        name: create_namespace
      vars:
        ns: "{{ stack.tempo.ns }}"
        mesh: "{{ cluster.mesh.kind }}"
    - name: Deploy the Tempo Helm chart
      kubernetes.core.helm:
        name: tempo
        create_namespace: false
        release_namespace: "{{ stack.tempo.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-tempo"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          cluster:
            name: "{{ cluster.name }}"
            edge:
              kind: "{{ cluster.edge.kind }}"
              fqdn: "{{ stack.tempo.hostname }}.{{ infra.dns.domain }}"
              gateway:
                name: "{{ cluster.edge.name }}"
                ns: "{{ cluster.edge.ns }}"
          tempo:
            tempo:
              storage:
                trace:
                  backend: s3
                  s3:
                    endpoint: "{{ infra.s3.client_fqdn }}:{{ infra.s3.port }}"
                    access_key: "{{ infra.s3.access_key }}"
                    secret_key: "{{ infra.s3.secret_key }}"
                    region: us-east-1
                    insecure: false
                    tls_insecure_skip_verify: true
    - name: Update DNS with a record for Tempo
      dns_record:
        dns_ip: "{{ infra.dns.ip }}"
        dns_admin_key_name: "{{ infra.dns.admin_key_name }}"
        dns_admin_key_secret: "{{ infra.dns.admin_key_secret }}"
        dns_protocol: "{{ infra.dns.protocol }}"
        dns_zone: "{{ infra.dns.zone }}"
        dns_record: "{{ stack.tempo.hostname }}.{{ infra.dns.domain }}."
        dns_value: "{{ edge_gateway.resources[0].status.addresses[0].value }}"
        dns_ttl: "{{ infra.dns.ttl | int }}"

  - name: Deploy Kiali
    when: "stack.kiali.enabled | bool == true"
    block:
    - name: Register Kiali in Keycloak
      idp_client:
        idp_url: "{{ infra.idp.client_base_url }}"
        idp_admin_user: "{{ infra.idp.admin_user }}"
        idp_admin_password: "{{ infra.idp.admin_password }}"
        idp_realm: "{{ infra.idp.realm }}"
        idp_ca_path: "{{ infra.pki.ca_truststore_path }}"
        client_id: "{{ stack.kiali.client_id }}"
        name: "Kube Eng :: Kiali"
        description: "Istio traffic management and observability for the Kube-Eng cluster"
        root_url: "https://{{ stack.kiali.hostname }}.{{ infra.dns.domain }}/"
        redirect_uris:
        - "https://{{ stack.kiali.hostname }}.{{ infra.dns.domain }}/*"
        public_client: false
        flows:
        - direct_access_grants
        state: present
      register: kiali_idp_client
      no_log: true
    - name: Collect information about the Kiali Service Account
      kubernetes.core.k8s_info:
        api_version: grafana.integreatly.org/v1beta1
        kind: GrafanaServiceAccount
        name: kiali-grafana-serviceaccount
        namespace: "{{ stack.grafana.ns }}"
      register: kiali_grafana_sa
    - name: Collect information about the Kiali Service Account token
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ kiali_grafana_sa.resources[0].status.account.tokens[0].secret.name }}"
        namespace: "{{ kiali_grafana_sa.resources[0].status.account.tokens[0].secret.namespace }}"
      register: kiali_grafana_sa_token
    - name: Create and label the Kiali namespace
      ansible.builtin.import_role:
        name: create_namespace
      vars:
        ns: "{{ stack.kiali.ns }}"
        mesh: "{{ cluster.mesh.kind }}"
        waypoint: wp-kiali
    - name: Create a secret for the Kiali OIDC client secret
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kiali
            namespace: "{{ stack.kiali.ns }}"
          type: Opaque
          stringData:
            oidc-secret: "{{ kiali_idp_client.client_secret }}"
        state: present
    - name: Deploy the Kiali Helm Chart
      kubernetes.core.helm:
        name: kiali
        create_namespace: false
        release_namespace: "{{ stack.kiali.ns }}"
        chart_ref: "{{ infra.registry.oci_endpoint }}/kube-eng/kube-eng-kiali"
        chart_version: "{{ host.tool.helm.chart_version }}"
        binary_path: "{{ host.tool.helm.path }}"
        wait: true
        values:
          cluster:
            name: "{{ cluster.name }}"
            edge:
              kind: "{{ cluster.edge.kind }}"
              fqdn: "{{ stack.kiali.hostname }}.{{ infra.dns.domain }}"
              gateway:
                name: "{{ cluster.edge.name }}"
                ns: "{{ cluster.edge.ns }}"
          integration:
            keycloak:
              client_id: "{{ stack.kiali.client_id }}"
              issuer_uri: "{{ infra.idp.issuer_url }}"
            prometheus:
              hostname: "{{ stack.prometheus.hostname }}"
              ns: "{{ stack.prometheus.ns }}"
              url: "http://prometheus-operated.{{ stack.prometheus.ns }}.svc.cluster.local:9090/"
            grafana:
              internal_url: "http://grafana-service.{{ stack.grafana.ns }}.svc.cluster.local:3000/"
              external_url: "https://{{ stack.grafana.hostname }}.{{ infra.dns.domain }}/"
              auth:
                username: "{{ kiali_grafana_sa.resources[0].status.account.login }}"
                token: "{{ kiali_grafana_sa_token.resources[0].data.token | b64decode }}"
            tempo:
              internal_url: "http://tempo.{{ stack.tempo.ns }}.svc.cluster.local:3200/"
              external_url: "https://{{ stack.tempo.hostname }}.{{ infra.dns.domain }}/"
              collector_url: "tempo.{{ stack.tempo.ns }}.svc.cluster.local:4317"
    - name: Update DNS with a record for Kiali
      dns_record:
        dns_ip: "{{ infra.dns.ip }}"
        dns_admin_key_name: "{{ infra.dns.admin_key_name }}"
        dns_admin_key_secret: "{{ infra.dns.admin_key_secret }}"
        dns_protocol: "{{ infra.dns.protocol }}"
        dns_zone: "{{ infra.dns.zone }}"
        dns_record: "{{ stack.kiali.hostname }}.{{ infra.dns.domain }}."
        dns_value: "{{ edge_gateway.resources[0].status.addresses[0].value }}"
        dns_ttl: "{{ infra.dns.ttl | int }}"
