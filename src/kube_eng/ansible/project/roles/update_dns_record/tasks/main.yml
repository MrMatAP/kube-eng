---
- name: Update DNS A record
  community.general.nsupdate:
    key_name: "{{ dns_key_name }}"
    key_secret: "{{ dns_key_secret }}"
    key_algorithm: "{{ dns_key_algorithm }}"
    server: "{{ dns_server }}"
    port: "{{ dns_port | int }}"
    protocol: "{{ dns_protocol }}"
    record: "{{ dns_record }}"
    ttl: "{{ dns_ttl | int }}"
    value: "{{ dns_value }}"
    type: A
    state: present
