---
- name: Fetch chart dependencies
  ansible.builtin.command:
    cmd: "{{ helm_tool_path }} dependency update {{ chart_src_path }}"
  # 'dependency build' trusts an existing Chart.lock verbatim, even when it
  # no longer matches Chart.yaml (e.g. after a manual version bump) -- a
  # stale cached .tgz left over from before such a bump then silently
  # ignores that dependency's 'condition', unconditionally installing it.
  # 'update' always reconciles charts/ and Chart.lock against the current
  # Chart.yaml, so it's the only one of the two that's safe to skip
  # forgetting to re-run by hand.

- name: Authenticate to the registry
  ansible.builtin.command:
    cmd: >
      {{ helm_tool_path }} registry login
      --username "{{ username }}"
      --password-stdin
      {% if registry_ca_path | length > 0 %}--ca-file "{{ registry_ca_path }}"{% endif %}
      {{ registry_url }}
    stdin: "{{ password }}"
  when: username | length > 0 and password | length > 0
  no_log: true

- name: Package the Helm chart
  ansible.builtin.command:
    cmd: >
      {{ helm_tool_path }} package
      --version {{ chart_version }}
      --destination {{ chart_pkg_path }}
      {{ chart_src_path }}

- name: Upload the Helm chart to the registry
  ansible.builtin.command:
    cmd: >
      {{ helm_tool_path }} push
      {{ chart_pkg_path }}/{{ chart_name }}-{{ chart_version }}.tgz
      {{ chart_registry_url }}
      {% if registry_ca_path | length > 0 %}--ca-file "{{ registry_ca_path }}"{% endif %}
