# Argument requirements. See https://docs.ansible.com/ansible/latest/dev_guide/developing_program_flow_modules.html#argument-spec
---
argument_specs:
  main:
    short_description: Package a Helm chart
    options:
      helm_tool_path:
        description: Path to the Helm binary
        type: str
        required: false
        default: /opt/homebrew/bin/helm
      chart_version:
        description: Version of the Helm chart
        type: str
        required: false
        default: 0.0.0-dev0
      chart_name:
        description: Name of the Helm chart
        type: str
        required: true
      chart_src_path:
        description: Path to the chart source directory
        type: str
        required: true
      chart_pkg_path:
        description: Path to the chart package directory
        type: str
        required: true
      chart_registry_url:
        description: URL of the Helm chart registry
        type: str
        required: true
      registry_url:
        description: >
          Host[:port] of the registry to authenticate against with
          `helm registry login`. Leave empty to skip authentication (e.g. a
          remote registry the caller has logged into out of band).
        type: str
        required: false
        default: ''
      registry_ca_path:
        description: >
          Path to a CA bundle used to verify the registry's TLS certificate
          during login and push. Leave empty to rely on the system trust store.
        type: str
        required: false
        default: ''
      username:
        description: Username for the Helm chart registry. Empty skips authentication.
        type: str
        required: false
        default: ''
      password:
        description: Password (or identity token) for the Helm chart registry.
        type: str
        required: false
        default: ''
        no_log: true
